{% extends "base.html" %}
{% block body %}
<div class="card">
  <h3>洞察（digest · 只读）</h3>
  <p class="muted">由 digest 流程产出；此处可直接触发（同 CLI <code>cenhua digest</code>，走任务通道 SSE 进度）。</p>
  <form hx-post="/insights/generate" hx-target="#gres" hx-swap="innerHTML">
    <div class="opts">
      <label>类型
        <select name="kind" style="width:auto;padding:4px 8px">
          <option value="weekly">周记</option>
          <option value="monthly">月报</option>
          <option value="quarterly">季报</option>
        </select></label>
      <label><input type="checkbox" name="dry_run" value="on"> dry-run（只算预算）</label>
      <label><input type="checkbox" name="force" value="on"> force 重算</label>
      <button type="submit">生成</button>
    </div>
  </form>
  <div id="gres"></div>
  {% if files %}
  <table>
    <tr><th>文件</th><th>产出时间</th></tr>
    {% for f in files %}
    <tr><td><a href="/insights/{{ f.name|urlencode }}">{{ f.name }}</a></td><td class="mono">{{ f.mtime }}</td></tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="muted">还没有洞察。CLI 跑一篇：<code>cenhua digest --weekly --dry-run</code> 先看预算。</p>
  {% endif %}
</div>
{% endblock %}
